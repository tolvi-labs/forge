name: Forge
version: 0.1.0
schema: v1

models:
  - name: Forge Chat
    provider: ollama
    model: qwen2.5-coder:7b
    roles: [chat, edit, apply]
  - name: Forge Chat (Deep)
    provider: ollama
    model: forge-coder
    roles: [chat]
  - name: Forge Autocomplete
    provider: ollama
    model: qwen2.5-coder:7b
    roles: [autocomplete]
  - name: Forge Embeddings
    provider: ollama
    model: nomic-embed-text
    roles: [embed]

context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: folder
  - provider: tree
