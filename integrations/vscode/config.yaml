name: Forge
version: 0.1.0
schema: v1

models:
  - name: Forge Chat
    provider: ollama
    model: forge-coder
    roles: [chat, edit, apply]
  - name: Forge Autocomplete
    provider: ollama
    model: qwen2.5-coder:7b
    roles: [autocomplete]
  - name: Forge Embeddings
    provider: ollama
    model: nomic-embed-text
    roles: [embed]

context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: folder
  - provider: tree

# No-credential MCP servers wired by default. The full set (incl. github/jira/
# gcloud/firebase, which need credentials) lives in the repo's mcp/servers.json.
mcpServers:
  - name: git
    command: npx
    args: ["-y", "@cyanheads/git-mcp-server"]
  - name: context7
    command: npx
    args: ["-y", "@upstash/context7-mcp"]
  - name: sequential-thinking
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]
  - name: playwright
    command: npx
    args: ["-y", "@playwright/mcp"]
