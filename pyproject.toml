[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-cli"
version = "0.1.0"
description = "Local-first AI development environment"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Torres Atlantic, LLC" }]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "chromadb>=0.5",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "tiktoken>=0.8",
    "httpx>=0.27",
    "pathspec>=0.12",
    "watchdog>=4.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
forge = "forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
